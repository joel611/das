name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: bun install --frozen-lockfile
      # `build` is skipped on purpose: packages/stackchan-mod needs the Moddable SDK.
      - run: bun run check
      - run: bun run test
