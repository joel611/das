<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack-chan voice console</title>
<link rel="stylesheet" href="console.css">
</head>
<body>
<h1>Stack-chan voice console</h1>
<div class="layout">
<main>
  <div id="log" aria-live="polite"></div>
  <textarea id="text" rows="2" placeholder="Type a request. Enter sends, Shift+Enter adds a line." autofocus></textarea>
  <div class="row">
    <button id="send">Send</button>
    <label><input type="checkbox" id="dry" checked> Dry run</label>
    <button id="newconv" type="button">New conversation</button>
    <span class="meta" id="dev"></span>
  </div>
  <div id="warn" role="alert" hidden>Sends a real request: starts a Claude session in auto mode in an isolated worktree.</div>
  <div id="confirm" role="alertdialog" hidden>
    <strong>Send a REAL request?</strong> It starts a Claude session in auto mode in an isolated worktree:
    <q id="confirm-text"></q>
    <button id="confirm-yes" class="danger" type="button">Yes, send for real</button>
    <button id="confirm-no" type="button">Cancel</button>
  </div>
</main>
<aside>
  <h2>Server</h2>
  <div class="info" id="srv">loading...</div>
  <h2>Routable projects</h2>
  <input id="filter" placeholder="Filter projects">
  <ul id="projects"></ul>
</aside>
</div>
<script src="console.js"></script>
</body>
</html>
